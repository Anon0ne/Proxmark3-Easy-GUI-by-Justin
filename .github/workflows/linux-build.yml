name: Linux build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Proxmark3Suite/**'
      - '.github/workflows/linux-build.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install dependencies and test
        working-directory: Proxmark3Suite
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build and verify native Linux executable
        working-directory: Proxmark3Suite
        run: |
          python build_exe.py dist-linux
          ./dist-linux/Proxmark3Suite --self-test linux-self-smoke
          python package_linux.py
          mkdir -p linux-installer-smoke
          tar -xzf ../release/*Linux*.tar.gz -C linux-installer-smoke
          HOME="$PWD/linux-installer-smoke/home with spaces" sh linux-installer-smoke/Proxmark3EasyGUI/install.sh
          "./linux-installer-smoke/home with spaces/.local/opt/Proxmark3EasyGUI/Proxmark3Suite" --self-test linux-installed-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*Linux*.tar.gz
            Proxmark3Suite/linux-self-smoke/result.json
            Proxmark3Suite/linux-installed-smoke/result.json
          if-no-files-found: error
